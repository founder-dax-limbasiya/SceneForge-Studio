name: SceneForge checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test scene submitter
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Check browser JavaScript syntax
        run: node tools/check_frontend.mjs
      - name: Test browser GPU integration contract
        run: node tools/test_gpu_ui_contract.mjs
